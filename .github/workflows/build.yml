name: Build

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  macos:
    name: macOS Qt 6 (Apple Silicon)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install macOS dependencies
        run: |
          brew install cmake ninja qt pkgconf
          echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake -S . -B build-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DMARK_SHOT_WITH_LAYER_SHELL=OFF \
            -DMARK_SHOT_WITH_LIBPORTAL=OFF

      - name: Build
        run: cmake --build build-macos --parallel

      - name: Test
        run: ctest --test-dir build-macos --output-on-failure

      - name: Package application
        run: |
          python3 scripts/package-macos.py \
            --build-dir build-macos \
            --output "dist/Mark Shot.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Mark Shot.app" mark-shot-macos-arm64.zip
          hdiutil create -volname "Mark Shot" \
            -srcfolder "dist/Mark Shot.app" \
            -ov -format UDZO mark-shot-macos-arm64.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mark-shot-macos-arm64
          path: |
            mark-shot-macos-arm64.zip
            mark-shot-macos-arm64.dmg
          if-no-files-found: error
